plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.6'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'edu.espe'
version = '0.0.1-SNAPSHOT'
description = 'spring-lab'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Dependencias reactivas (NUEVAS)
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-data-r2dbc'

    // Dependencias existentes (mantenemos para compatibilidad temporal)
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // SpringDoc OpenAPI para documentación (NUEVO)
    implementation 'org.springdoc:springdoc-openapi-starter-webflux-ui:2.2.0'

    // Spring Security para WebFlux (NUEVO)
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.security:spring-security-config'


    // Drivers de bases de datos
    runtimeOnly 'com.mysql:mysql-connector-j'      // MySQL
    runtimeOnly 'org.postgresql:postgresql'        // PostgreSQL (Render)
    runtimeOnly 'com.h2database:h2:2.2.220'       // H2 (desarrollo local)

    // Driver R2DBC para H2 (NUEVO)
    runtimeOnly 'io.r2dbc:r2dbc-h2'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.projectreactor:reactor-test'  // Testing reactivo (NUEVO)
    testImplementation 'org.springframework.security:spring-security-test'  // Testing seguridad (NUEVO)
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'com.h2database:h2:2.2.220'
}

tasks.named('test') {
    useJUnitPlatform()
}
