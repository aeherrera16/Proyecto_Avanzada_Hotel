plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.6'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'edu.espe'
version = '0.0.1-SNAPSHOT'
description = 'spring-lab'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	
	// SpringDoc OpenAPI para documentación (NUEVO)
	implementation 'org.springdoc:springdoc-openapi-starter-webflux-ui:2.2.0'
	
	// Spring Security para WebFlux (NUEVO)
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.security:spring-security-config'
	
	// Micrometer para métricas (NUEVO)
	implementation 'io.micrometer:micrometer-registry-prometheus'
	
	// Jackson para JSON (NUEVO)
	implementation 'com.fasterxml.jackson.core:jackson-databind'

	// Drivers de bases de datos
	runtimeOnly 'com.mysql:mysql-connector-j'      // MySQL
	runtimeOnly 'org.postgresql:postgresql'        // PostgreSQL (Render)
	runtimeOnly 'com.h2database:h2:2.2.220'       // H2 (desarrollo local)

	// Testing
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
